# SLAM Toolbox Parameters for Persistent Mapping
# Roomba-style: saves map periodically and loads on startup

slam_toolbox:
  ros__parameters:
    # Core settings
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping  # Can be: mapping, localization

    # Map update settings
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 12.0
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.2

    # Transform settings
    transform_publish_period: 0.05
    tf_buffer_duration: 30.0

    # Scan matching
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_time_interval: 0.2
    
    # Loop closure settings  
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Ceres solver settings
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Interactive mode for RViz
    enable_interactive_mode: true

    # Stack settings
    stack_size_to_use: 40000000

    # Map file settings for persistence
    map_file_name: /home/max/ros2_ws/map/persistent_map
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: true